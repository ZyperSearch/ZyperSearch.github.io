name: ZyperSearch Auto-Crawler
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  crawl_and_index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essential for successful rebasing

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget jq

      - name: Set up Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.0-beta.1'
          allow-prereleases: true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx requests beautifulsoup4 lxml

      - name: Run Zyper Crawler
        run: python crawl.py

      - name: Sync and Deploy
        run: |
          git config --global rebase.autoStash true
          git pull --rebase origin main
          git config --global user.name "ZyperBot"
          git config --global user.email "bot@zypersearch.local"
          
          if [ -f data.json ]; then
            git add data.json
            # Rebase ensures your manual web edits aren't overwritten
            git pull --rebase origin main
            git commit -m "Automated ZyperSearch Index Update: $(date +'%Y-%m-%d')" || exit 0
            git push origin main
          else
            echo "data.json not found, skipping."
            exit 1
          fi
