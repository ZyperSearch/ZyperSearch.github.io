name: ZyperSearch Auto-Crawler
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  crawl_and_index:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push data.json back to the repo
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget jq

      - name: Set up Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.15-dev' # Uses the latest experimental build

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Zyper Crawler
        env:
          PYTHON_GIL: "0" # Enabling Free-Threading
        run: python crawl.py

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "ZyperBot"
          git config --global user.email "bot@zypersearch.local"
          git add data.json
          # Only commit if there are changes to avoid workflow failure
          git commit -m "Automated ZyperSearch Index Update: $(date +'%Y-%m-%d')" || exit 0
          git push
