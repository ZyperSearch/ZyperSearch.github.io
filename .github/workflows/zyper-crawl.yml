name: ZyperSearch Auto-Crawler
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  crawl_and_index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget jq

      - name: Set up Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.0-beta.1'
          allow-prereleases: true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Zyper Crawler
        # We remove PYTHON_GIL: "0" here to avoid the fatal config error.
        # Python 3.15 still handles ThreadPoolExecutor very efficiently for I/O.
        run: python crawl.py

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "ZyperBot"
          git config --global user.email "bot@zypersearch.local"
          # Check if data.json was created
          if [ -f data.json ]; then
            git add data.json
            git commit -m "Automated ZyperSearch Index Update: $(date +'%Y-%m-%d')" || exit 0
            git push
          else
            echo "data.json not found, skipping commit."
            exit 1
          fi
