<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZyperSearch</title>
    <style>
        :root { --google-blue: #4285f4; --text-gray: #4d5156; }
        body { font-family: arial, sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 10vh; }
        .logo { font-size: 72px; font-weight: bold; margin-bottom: 30px; }
        .logo span:nth-child(1) { color: #4285f4; }
        .logo span:nth-child(2) { color: #ea4335; }
        .logo span:nth-child(3) { color: #fbbc05; }
        .logo span:nth-child(4) { color: #4285f4; }
        .logo span:nth-child(5) { color: #34a853; }
        .search-box { width: 580px; padding: 12px 20px; border: 1px solid #dfe1e5; border-radius: 24px; font-size: 16px; outline: none; }
        .search-box:hover, .search-box:focus { box-shadow: 0 1px 6px rgba(32,33,36,0.28); }
        #results { width: 580px; margin-top: 20px; }
        .result-item { margin-bottom: 25px; }
        .result-item a { color: #1a0dab; font-size: 20px; text-decoration: none; }
        .result-item a:hover { text-decoration: underline; }
        .result-item p { color: var(--text-gray); font-size: 14px; margin: 5px 0; }
        #suggestion { color: #70757a; font-size: 14px; margin-top: 10px; width: 580px; display: none; }
        .suggest-link { color: #1a0dab; cursor: pointer; font-style: italic; }
    </style>
</head>
<body>

    <div class="logo"><span>Z</span><span>y</span><span>p</span><span>e</span><span>r</span></div>
    
    <input type="text" id="ui-search" class="search-box" placeholder="Search the web with Qwen3..." autofocus>
    
    <div id="suggestion">Did you mean: <span class="suggest-link" id="suggest-word"></span>?</div>
    
    <div id="results"></div>

    <script>
        let db = [];
        const searchInput = document.getElementById('ui-search');
        const resDiv = document.getElementById('results');
        const suggDiv = document.getElementById('suggestion');
        const suggWord = document.getElementById('suggest-word');

        // Fetch the AI-generated index
        fetch('./data.json').then(r => r.json()).then(data => db = data);

        searchInput.oninput = (e) => {
            const val = e.target.value.toLowerCase();
            resDiv.innerHTML = '';
            suggDiv.style.display = 'none';

            if (val.length < 2) return;

            const matches = db.filter(i => i.title.toLowerCase().includes(val) || i.raw.toLowerCase().includes(val));
            
            if (matches.length > 0) {
                matches.forEach(m => {
                    resDiv.innerHTML += `
                        <div class="result-item">
                            <a href="${m.url}">${m.title}</a>
                            <p>${m.content}</p>
                        </div>`;
                });
            } else {
                // Basic "Did you mean" logic using the AI summary tags
                const suggestion = db.find(i => i.content.toLowerCase().includes(val));
                if (suggestion) {
                    suggDiv.style.display = 'block';
                    suggWord.innerText = suggestion.title;
                    suggWord.onclick = () => { searchInput.value = suggestion.title; searchInput.oninput({target: searchInput}); };
                }
            }
        };
    </script>
</body>
</html>
