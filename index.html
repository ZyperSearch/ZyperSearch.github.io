<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyperSearch</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #58f01b;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --border-color: #333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding-top: 15vh;
        }
        .logo {
            font-size: 84px;
            font-weight: 800;
            margin-bottom: 40px;
            letter-spacing: -2px;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(88, 240, 27, 0.2);
        }
        .search-container {
            width: 90%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
        }
        .search-box {
            width: 100%;
            padding: 14px 24px;
            background: #111;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            font-size: 18px;
            color: white;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }
        .search-box:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(88, 240, 27, 0.15);
        }
        #results {
            margin-top: 30px;
            width: 100%;
        }
        .result-item {
            margin-bottom: 32px;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-item a {
            color: var(--accent-color);
            font-size: 22px;
            text-decoration: none;
            display: block;
            margin-bottom: 4px;
        }
        .result-item a:hover {
            text-decoration: underline;
        }
        .result-item p {
            color: var(--text-dim);
            font-size: 15px;
            line-height: 1.5;
            margin: 0;
        }
        #suggestion {
            color: var(--text-dim);
            font-size: 14px;
            margin: 15px 0 0 20px;
            display: none;
        }
        .suggest-link {
            color: var(--accent-color);
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="logo">Zyper</div>
    <div class="search-container">
        <input type="text" id="ui-search" class="input search-box" placeholder="Explore the system..." autofocus autocomplete="off">
        <div id="suggestion">Did you mean: <span class="suggest-link" id="suggest-word"></span>?</div>
        <div id="results"></div>
    </div>
    <script>
        let db = [];
        const searchInput = document.getElementById('ui-search');
        const resDiv = document.getElementById('results');
        const toggSugg = document.getElementById('suggestion');
        const toggWord = document.getElementById('suggest-word');

        const loadData = async () => {
            try {
                const response = await fetch('./data.json');
                if (!response.ok) throw new Error("File not found");
                db = await response.json();
                const params = new URLSearchParams(window.location.search);
                const query = params.get('search');
                if (query) {
                    searchInput.value = query;
                    performSearch(query);
                }
            } catch (err) {
                console.error("Index unavailable. Run the crawler to generate data.json.");
            }
        };

        function highlight(text, query) {
            if (!query) return text;
            const q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return text.replace(new RegExp(q, 'gi'), match => `<span style="background:rgba(88,240,27,0.2);color:#58f01b;">${match}</span>`);
        }

        const renderResults = (matches, query="") => {
            resDiv.innerHTML = matches.length ?
                matches.map(m => `
                    <div class="result-item">
                        <a href="${m.url}" target="_blank" rel="noopener">${highlight(m.title, query)}</a>
                        <p>${highlight(m.content, query)}</p>
                    </div>
                `).join('') :
                '<div style="color:#a0a0a0;">No results found.</div>';
        };

        const performSearch = (val) => {
            const url = new URL(window.location);
            const cleanVal = val.trim();
            
            if (cleanVal.length === 0) {
                url.searchParams.delete('search');
                window.history.replaceState({}, '', url);
                resDiv.innerHTML = '';
                toggSugg.style.display = 'none';
                return;
            }

            url.searchParams.set('search', cleanVal);
            window.history.replaceState({}, '', url);

            resDiv.innerHTML = '';
            toggSugg.style.display = 'none';

            if (cleanVal.length < 2) return;

            const lowerVal = cleanVal.toLowerCase();
            const matches = db.filter(i =>
                (i.title && i.title.toLowerCase().includes(lowerVal)) ||
                (i.raw && i.raw.toLowerCase().includes(lowerVal)) ||
                (i.content && i.content.toLowerCase().includes(lowerVal))
            );

            if (matches.length > 0) {
                renderResults(matches, cleanVal);
            } else {
                const suggestion = db.find(i =>
                    i.title && i.title.toLowerCase().startsWith(lowerVal.slice(0, 1))
                );
                renderResults([]);
                if (suggestion) {
                    toggSugg.style.display = 'block';
                    toggWord.innerText = suggestion.title;
                    toggWord.onclick = () => {
                        searchInput.value = suggestion.title;
                        performSearch(suggestion.title);
                    };
                }
            }
        };

        searchInput.addEventListener('input', (e) => {
            performSearch(e.target.value);
        });

        loadData();
    </script>
</body>
</html>
